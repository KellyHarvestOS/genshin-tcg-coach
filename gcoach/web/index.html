    <symbol id="ic-sword" viewBox="0 0 24 24"><use href="#el-physical"/></symbol>
    <symbol id="ic-skill" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M12 5.5c.6 3.8 2.7 5.9 6.5 6.5-3.8.6-5.9 2.7-6.5 6.5-.6-3.8-2.7-5.9-6.5-6.5 3.8-.6 5.9-2.7 6.5-6.5z" fill="currentColor"/></symbol>
    <symbol id="ic-burst" viewBox="0 0 24 24"><path d="M12 1.5l2.2 5.6 5.9-1.3-3.4 5 4.3 4.2-6 .5-.8 6-3.4-4.9L5.5 19l1.5-5.8L1.7 10.6 7.5 9 7 3z" fill="currentColor"/><circle cx="12" cy="11.5" r="3" fill="#fff" opacity=".75"/></symbol>

    <symbol id="ic-summon" viewBox="0 0 24 24"><path d="M12 3.5c4.4 0 7 3 7 6.8 0 5-4.2 7.2-7 10.2-2.8-3-7-5.2-7-10.2 0-3.8 2.6-6.8 7-6.8z" fill="currentColor"/><circle cx="9.5" cy="10" r="1.4" fill="#fff"/><circle cx="14.5" cy="10" r="1.4" fill="#fff"/><path d="M4 5.5 2.5 4M20 5.5 21.5 4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></symbol>
    <symbol id="ic-shield" viewBox="0 0 24 24"><path d="M12 2.5 19.5 5.3v6.2c0 4.6-3.2 8.3-7.5 9.9-4.3-1.6-7.5-5.3-7.5-9.9V5.3z" fill="currentColor"/><path d="M12 5.2v13.3" stroke="#fff" stroke-width="1" opacity=".5"/></symbol>
    <symbol id="ic-crown" viewBox="0 0 24 24"><path d="M3 18.5 2 7.5l5.2 4L12 4l4.8 7.5L22 7.5l-1 11z" fill="currentColor"/><path d="M3.5 21h17" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
    <symbol id="ic-camera" viewBox="0 0 24 24"><path d="M4 7.5h3.2L9 5h6l1.8 2.5H20v11.5H4z" stroke="currentColor" stroke-width="1.7" fill="none" stroke-linejoin="round"/><circle cx="12" cy="13" r="3.4" stroke="currentColor" stroke-width="1.7" fill="none"/></symbol>
    <symbol id="ic-eye" viewBox="0 0 24 24"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z" stroke="currentColor" stroke-width="1.7" fill="none"/><circle cx="12" cy="12" r="2.8" fill="currentColor"/></symbol>
    <symbol id="ic-image" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="14" rx="2" stroke="currentColor" stroke-width="1.7" fill="none"/><path d="m5.5 17 4.5-5 3.2 3.4 2.3-2.4 3 4" stroke="currentColor" stroke-width="1.7" fill="none" stroke-linejoin="round"/><circle cx="15.5" cy="9" r="1.4" fill="currentColor"/></symbol>
    <symbol id="ic-team" viewBox="0 0 24 24"><circle cx="9" cy="8.5" r="3" stroke="currentColor" stroke-width="1.7" fill="none"/><path d="M3 19c.7-3.2 2.9-5 6-5s5.3 1.8 6 5" stroke="currentColor" stroke-width="1.7" fill="none" stroke-linecap="round"/><path d="M15.5 5.8a3 3 0 1 1 .8 5.8M18 14.3c1.6.6 2.6 2 3 4.2" stroke="currentColor" stroke-width="1.7" fill="none" stroke-linecap="round"/></symbol>
    <symbol id="ic-more" viewBox="0 0 24 24"><circle cx="5.5" cy="12" r="1.8" fill="currentColor"/><circle cx="12" cy="12" r="1.8" fill="currentColor"/><circle cx="18.5" cy="12" r="1.8" fill="currentColor"/></symbol>
    <symbol id="ic-play" viewBox="0 0 24 24"><path d="M8 5.5v13l10-6.5z" fill="currentColor"/></symbol>
    <symbol id="ic-refresh" viewBox="0 0 24 24"><path d="M19 12a7 7 0 1 1-2.05-4.95M19 4.5v3.8h-3.8" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></symbol>

<div class="sky" aria-hidden="true"></div>
<canvas id="sparkles" aria-hidden="true"></canvas>

<header class="topbar">
  <div class="brand">
    <img class="wordmark" src="/static/img/wordmark.png" alt="Card Coach" draggable="false">  </div>
  <div class="match-pills" id="matchPills"></div>
  <div class="partner">
  <nav class="rail" aria-label="Управление">
    <button class="rbtn toggle" id="btnWatch" data-tip="Слежение: анализировать экран после каждого вашего хода"><svg><use href="#ic-eye"/></svg><img class="rart" src="/static/img/rail/watch.png" alt="" draggable="false" onload="this.parentNode.classList.add('has-art')" onerror="this.remove()"></button>
    <button class="rbtn toggle" id="btnVoice" data-tip="Голос: говорить советы вслух (F8 — повторить)"><svg><use href="#ic-voice"/></svg><img class="rart" src="/static/img/rail/voice.png" alt="" draggable="false" onload="this.parentNode.classList.add('has-art')" onerror="this.remove()"></button>
    <div class="menu-wrap">
      <button class="rbtn" id="btnMenu" aria-label="Меню" data-tip="Меню"><svg><use href="#ic-more"/></svg><img class="rart" src="/static/img/rail/menu.png" alt="" draggable="false" onload="this.parentNode.classList.add('has-art')" onerror="this.remove()"></button>
      <div class="menu" id="menu" hidden>
        <div class="menu-label">Демо-партии</div>
        <div id="menuDemos"></div>
        <div class="menu-sep"></div>
        <button data-act="setup">Настроить партию…</button>
        <button data-act="voice">Голос и озвучка…</button>
        <button data-act="explain">Почему этот ход (AI)</button>
        <button data-act="state">Состояние (JSON)</button>
        <button data-act="end">Завершить партию и разобрать</button>
        <button data-act="debug">Отладка</button>
      </div>
    </div>
  </nav>
  <img class="colab" src="/static/img/colab.png" alt="Genshin Impact × KellyHarvest" draggable="false"></div>
</header>


<div class="banner" id="banner" hidden></div>

<main class="layout" id="layout"></main>

<section class="debug-drawer" id="debug" hidden>
  <div class="debug-head">
    <div class="tabs" id="debugTabs">
      <button data-tab="shot" class="active">Скриншот</button>
      <button data-tab="conf">Распознавание</button>
      <button data-tab="cand">Кандидаты</button>
      <button data-tab="tree">Дерево планов</button>
      <button data-tab="log">Журнал</button>
      <button data-tab="json">GameState</button>
    </div>
    <button class="btn ghost icon-only" id="btnDebugClose" aria-label="Закрыть"><svg><use href="#ic-close"/></svg></button>
  </div>
  <div class="debug-body" id="debugBody"></div>
</section>

<div class="modal" id="modal" hidden>
  <div class="modal-card">
    <div class="modal-head"><h3 id="modalTitle"></h3><button class="btn ghost icon-only" id="modalClose" aria-label="Закрыть"><svg><use href="#ic-close"/></svg></button></div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-foot" id="modalFoot"></div>
  </div>
</div>

<div class="toasts" id="toasts"></div>
<div class="tooltip" id="tooltip" hidden></div>
<datalist id="dlChars"></datalist>
<datalist id="dlCards"></datalist>
<script src="/static/app.js"></script>
</body>
</html>
